name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # tsc relies on .next/types/**, which Next only generates on a build,
      # dev run, or `next typegen` — a fresh checkout has none of those yet.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
